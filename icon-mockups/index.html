<!doctype html>
<meta charset="utf-8"><title>Foredeck icon mockups</title>
<style>
  body { margin:0; padding:32px 16px; background:#e9e9ec; font:15px -apple-system,system-ui,sans-serif; color:#222 }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:28px; max-width:1300px; margin:auto }
  figure { margin:0; text-align:center }
  .big { width:100%; max-width:220px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.25)) }
  .small { display:flex; gap:12px; justify-content:center; align-items:end; margin:12px 0 6px }
  figcaption { font-weight:600 }
</style>
<main>
  <figure>
    <img class="big" src="1-anchor-waves.svg" alt="Anchor with sound waves">
    <div class="small"><img src="1-anchor-waves.svg" width="60"><img src="1-anchor-waves.svg" width="40"><img src="1-anchor-waves.svg" width="29"></div>
    <figcaption>1. Anchor with sound waves</figcaption>
  </figure>

  <figure>
    <img class="big" src="2-swing-circle.svg" alt="Swing circle">
    <div class="small"><img src="2-swing-circle.svg" width="60"><img src="2-swing-circle.svg" width="40"><img src="2-swing-circle.svg" width="29"></div>
    <figcaption>2. Swing circle</figcaption>
  </figure>

  <figure>
    <img class="big" src="3-hull-bubbles.svg" alt="Hull speech bubbles">
    <div class="small"><img src="3-hull-bubbles.svg" width="60"><img src="3-hull-bubbles.svg" width="40"><img src="3-hull-bubbles.svg" width="29"></div>
    <figcaption>3. Hull speech bubbles</figcaption>
  </figure>

  <figure>
    <img class="big" src="4-bow-pulpit.svg" alt="Bow and pulpit">
    <div class="small"><img src="4-bow-pulpit.svg" width="60"><img src="4-bow-pulpit.svg" width="40"><img src="4-bow-pulpit.svg" width="29"></div>
    <figcaption>4. Bow and pulpit</figcaption>
  </figure>

  <figure>
    <img class="big" src="5-night-watch.svg" alt="Night watch">
    <div class="small"><img src="5-night-watch.svg" width="60"><img src="5-night-watch.svg" width="40"><img src="5-night-watch.svg" width="29"></div>
    <figcaption>5. Night watch</figcaption>
  </figure>
</main>
